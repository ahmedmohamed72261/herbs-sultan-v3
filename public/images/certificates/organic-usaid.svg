<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_organic-usaid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#E2EBE5"/>
    </radialGradient>
    <linearGradient id="goldGrad_organic-usaid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#38A169"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="accentGrad_organic-usaid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <filter id="shadow_organic-usaid" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Card Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad_organic-usaid)"/>
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="url(#goldGrad_organic-usaid)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Center Decorative Shield/Seal -->
  <g filter="url(#shadow_organic-usaid)" transform="translate(200, 175)">
    <!-- Outer Gold Ring -->
    <circle r="120" fill="#ffffff" stroke="url(#goldGrad_organic-usaid)" stroke-width="8"/>
    <!-- Inner Accent Ring -->
    <circle r="106" fill="url(#accentGrad_organic-usaid)" stroke="url(#goldGrad_organic-usaid)" stroke-width="2"/>
    <!-- Subtle Inner Pattern Ring -->
    <circle r="96" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Gold Laurel Wreath Left -->
    <path d="M-80,-20 C-85,20 -60,65 -25,85 C-30,75 -45,55 -50,30 C-55,5 -50,-10 -80,-20 Z" fill="url(#goldGrad_organic-usaid)" opacity="0.85"/>
    <!-- Gold Laurel Wreath Right -->
    <path d="M80,-20 C85,20 60,65 25,85 C30,75 45,55 50,30 C55,5 50,-10 80,-20 Z" fill="url(#goldGrad_organic-usaid)" opacity="0.85"/>

    <!-- Decorative Top Stars -->
    <polygon points="0,-75 3,-68 10,-68 5,-64 7,-57 0,-61 -7,-57 -5,-64 -10,-68 -3,-68" fill="url(#goldGrad_organic-usaid)"/>
    <polygon points="-22,-70 -19,-64 -12,-64 -17,-60 -15,-54 -22,-57 -29,-54 -27,-60 -32,-64 -25,-64" fill="url(#goldGrad_organic-usaid)"/>
    <polygon points="22,-70 25,-64 32,-64 27,-60 29,-54 22,-57 15,-54 17,-60 12,-64 19,-64" fill="url(#goldGrad_organic-usaid)"/>

    <!-- Certified Stamp Badge Text -->
    <text y="-25" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="url(#goldGrad_organic-usaid)" letter-spacing="3">OFFICIAL AUDITED</text>
    
    <!-- Main Center Accreditation Acronym -->
    <text y="15" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">ORGANIC USAID</text>
    
    <!-- Standard Subtitle Inside Ring -->
    <text y="42" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#E0F2F1" letter-spacing="1">AUTHENTIC CERTIFIED</text>
  </g>

  <!-- Bottom Ribbon / Label -->
  <g transform="translate(200, 345)">
    <!-- Ribbon Base -->
    <rect x="-150" y="-22" width="300" height="44" rx="22" fill="url(#accentGrad_organic-usaid)" stroke="url(#goldGrad_organic-usaid)" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="0.5">ORGANIC USAID Standard</text>
  </g>
</svg>